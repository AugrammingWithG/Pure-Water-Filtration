<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Pure Water Filtration — Australia's trusted water filtration specialists."
    />
    <title>Pure Water Filtration</title>
    <!--
      Root-relative, not "./" — Vite rewrites a leading "/" to the deploy's base
      (/Pure-Water-Filtration/ on GitHub Pages, see vite.config.js), so these
      resolve correctly there without hardcoding the prefix. All three are
      produced by scripts/fetch-site-assets.mjs from the client's own mark; do
      not hand-replace them, change the script.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b2545" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DM Sans / Manrope dress the page; Space Grotesk / Inter dress the 3D viewer. -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
